name: Regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: tracker_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install ruff==0.15.0 playwright==1.58.0
      - run: python -m pip check
      - run: python -m ruff check --select F821,F822,F823 .
      - run: python tools/generate_techmap.py --check
      - run: python -m playwright install --with-deps chromium
      - run: python tools/smoke_browser.py
      - run: python -m unittest discover -s tests -v
        env:
          TEST_NOTIFICATION_DATABASE_URL: postgresql://tracker:fixture-only@localhost:${{ job.services.postgres.ports[5432] }}/tracker_test
